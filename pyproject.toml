[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-device-portal"
version = "1.0.2"
description = "Self-hosted, sequential Android device-matrix testing on a single Windows machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlueFluteX", email = "support@blueflutex.in" }]
keywords = ["android", "emulator", "testing", "play-store", "fastapi", "qa"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/vikasdocker/android-device-portal"
Company = "https://blueflutex.in/"
Source = "https://github.com/vikasdocker/android-device-portal"
Issues = "https://github.com/vikasdocker/android-device-portal/issues"
Changelog = "https://github.com/vikasdocker/android-device-portal/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
packages = ["portal", "portal.app"]
include-package-data = true

[tool.setuptools.package-data]
portal = ["web/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "tools", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
